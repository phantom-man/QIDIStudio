<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexusGauge — Precision at a Scale You Haven't Seen</title>
<meta name="description" content="A new kind of measurement tool for 3D models. Coming soon from Nexus Workshop."/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#060d0b;color:#eef5f2;font-family:'Segoe UI',system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}

.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:56px 56px;animation:drift 25s linear infinite}
@keyframes drift{0%{background-position:0 0}100%{background-position:56px 56px}}
.gfade{position:fixed;inset:0;background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 30%,#060d0b 100%)}

/* crosshair */
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:340px;height:340px;pointer-events:none;opacity:.07;animation:spin 30s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.glow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(ellipse,rgba(34,211,238,.07) 0%,transparent 70%);pointer-events:none;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}

.content{position:relative;z-index:10;text-align:center;padding:2rem 1.5rem;max-width:640px}

.logo{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:3.5rem;text-decoration:none}
.logo-mark{width:36px;height:36px}
.logo-text{font-size:1.2rem;font-weight:700;color:#eef5f2;letter-spacing:-.01em}

.badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.18);border-radius:99px;padding:.3rem 1rem;font-size:.75rem;color:#67e8f9;margin-bottom:2rem;letter-spacing:.02em}

h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;line-height:1.08;letter-spacing:-.04em;margin-bottom:1.25rem;background:linear-gradient(160deg,#fff 20%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:clamp(.95rem,2vw,1.15rem);color:#4a6660;max-width:460px;margin:0 auto 3rem;line-height:1.7}

.form{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.2rem}
.input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:.7rem 1.1rem;font-size:.9rem;color:#eef5f2;width:260px;outline:none;transition:border-color .2s}
.input::placeholder{color:#2a4040}
.input:focus{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.03)}
.btn{background:#22d3ee;color:#000;border:none;border-radius:10px;padding:.7rem 1.5rem;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.note{font-size:.75rem;color:#2a4040}

.divider{width:60px;height:1px;background:rgba(34,211,238,.15);margin:3rem auto}

.links{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.links a{color:#2a4040;text-decoration:none;font-size:.82rem;transition:color .15s}
.links a:hover{color:#eef5f2}

.corner{position:fixed;bottom:1.5rem;right:1.5rem;font-size:.72rem;color:#1a2e28;z-index:10}
</style>
</head>
<body>
<div class="grid"></div>
<div class="gfade"></div>

<!-- SVG crosshair spinner -->
<svg class="crosshair" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="170" cy="170" r="160" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8 6"/>
  <circle cx="170" cy="170" r="110" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="0" y1="170" x2="340" y2="170" stroke="#22d3ee" stroke-width="1"/>
  <line x1="170" y1="0" x2="170" y2="340" stroke="#22d3ee" stroke-width="1"/>
  <circle cx="170" cy="170" r="4" fill="#22d3ee"/>
  <circle cx="170" cy="170" r="12" stroke="#22d3ee" stroke-width="1"/>
</svg>
<div class="glow"></div>

<div class="content">
  <a class="logo" href="https://nexusslicer.com">
    <svg class="logo-mark" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="9" fill="#22d3ee"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2.5"/>
      <line x1="18" y1="5" x2="18" y2="10" stroke="rgba(0,0,0,.6)" stroke-width="2.5"/>
      <line x1="18" y1="26" x2="18" y2="31" stroke="rgba(0,0,0,.6)" stroke-width="2.5"/>
      <line x1="5" y1="18" x2="10" y2="18" stroke="rgba(0,0,0,.6)" stroke-width="2.5"/>
      <line x1="26" y1="18" x2="31" y2="18" stroke="rgba(0,0,0,.6)" stroke-width="2.5"/>
    </svg>
    <span class="logo-text">NexusGauge</span>
  </a>

  <div class="badge">&#9141; Nexus Workshop &nbsp;&middot;&nbsp; Coming Soon</div>

  <h1>Precision at a scale<br/>you haven't seen.</h1>
  <p class="sub">A new kind of measurement tool for 3D models. We're still building it &mdash; but when it's ready, you'll want to be first.</p>

  <form class="form" onsubmit="return false">
    <input class="input" type="email" placeholder="your@email.com" autocomplete="email"/>
    <button class="btn" type="submit">Notify me</button>
  </form>
  <div class="note">No spam. One email when we launch.</div>

  <div class="divider"></div>

  <div class="links">
    <a href="https://nexusslicer.com">NexusSlicer</a>
    <a href="https://nexusmill.com">NexusMill</a>
    <a href="https://github.com/phantom-man">GitHub</a>
    <a href="mailto:hello@nexusgauge.com">Contact</a>
  </div>
</div>

<div class="corner">Nexus Workshop &copy; 2026</div>
</body>
</html>
