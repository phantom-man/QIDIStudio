# ─────────────────────────────────────────────────────────────────────────────
# QIDI Q2 — Klipper printer.cfg snippets for AMEO integration
# ─────────────────────────────────────────────────────────────────────────────
# These sections slot into ~/printer_data/config/printer.cfg on the Qidi Q2.
# Copy the relevant blocks into your existing config — do NOT replace the full
# file.  Each block is labelled with where in printer.cfg it belongs.
#
# After editing:
#   sudo systemctl restart klipper
#   FIRMWARE_RESTART (in Mainsail/Fluidd console)

# ─────────────────────────────────────────────────────────────────────────────
# SECTION A — Shell command bridge (add near top of printer.cfg, after [mcu])
# ─────────────────────────────────────────────────────────────────────────────
# Required by AMEO_LOAD to call the Python vision bridge that resolves
# nozzle+material profile params from ameo_profiles.json.

[gcode_shell_command ameo_load_profile]
command: python3 /home/qidi/printer_data/config/ameo_service.py
timeout: 8.0
verbose: False


# ─────────────────────────────────────────────────────────────────────────────
# SECTION B — AMEO state variables (add after [gcode_shell_command] block)
# ─────────────────────────────────────────────────────────────────────────────
# These variables hold the currently loaded profile.  They are set by
# AMEO_LOAD and read by AI_REFLEXIVE_ADJUST.

[gcode_macro AMEO_INIT]
variable_nozzle_id:   'qidi_04'
variable_material_id: 'anycubic_pla_hs'
variable_layer_h:     0.2
variable_flow_adj:    1.0
variable_speed_adj:   1.0
variable_temp_offset: 0
gcode:
    # Called internally by AMEO_LOAD after profile resolution.
    # Sets printer state from resolved profile params.
    {% set ns = params.NOZZLE_TEMP   | default(230) | int %}
    {% set bt = params.BED_TEMP      | default(55)  | int %}
    {% set pa = params.PA_VALUE      | default(0.04)| float %}
    M104 S{ns}          ; set nozzle temp (non-blocking — heat while homing)
    M140 S{bt}          ; set bed temp (non-blocking)
    SET_PRESSURE_ADVANCE ADVANCE={pa}


# ─────────────────────────────────────────────────────────────────────────────
# SECTION C — AMEO_LOAD macro (add after AMEO_INIT)
# ─────────────────────────────────────────────────────────────────────────────

[gcode_macro AMEO_LOAD]
description: Load a nozzle+material profile by ID — calls vision bridge to resolve params
# Slicer start-gcode usage:
#   AMEO_LOAD NOZZLE=cht_diamond_04 MATERIAL=anycubic_pla_hs LAYER_H=0.2
gcode:
    {% set nozzle_id   = params.NOZZLE   | default("qidi_04") %}
    {% set material_id = params.MATERIAL | default("anycubic_pla_hs") %}
    {% set layer_h     = params.LAYER_H  | default(0.2) | float %}
    SET_GCODE_VARIABLE MACRO=AMEO_INIT VARIABLE=nozzle_id   VALUE="'{nozzle_id}'"
    SET_GCODE_VARIABLE MACRO=AMEO_INIT VARIABLE=material_id VALUE="'{material_id}'"
    SET_GCODE_VARIABLE MACRO=AMEO_INIT VARIABLE=layer_h     VALUE={layer_h}
    # Call bridge: resolves params, then calls AMEO_INIT with resolved values
    RUN_SHELL_COMMAND CMD=ameo_load_profile PARAMS="{nozzle_id},{material_id},{layer_h}"


# ─────────────────────────────────────────────────────────────────────────────
# SECTION D — AI_REFLEXIVE_ADJUST macro (add after AMEO_LOAD)
# ─────────────────────────────────────────────────────────────────────────────

[gcode_macro AI_REFLEXIVE_ADJUST]
description: Apply AI vision bridge corrections — flow, speed, and optional Z nudge
gcode:
    {% set flow_adj  = params.FLOW    | default(1.0) | float %}
    {% set speed_adj = params.SPEED   | default(1.0) | float %}
    {% set z_nudge   = params.Z_NUDGE | default(0.0) | float %}

    # Clamp to safety bounds
    {% set flow_adj  = [0.75, [flow_adj,  1.30]|min]|max %}
    {% set speed_adj = [0.50, [speed_adj, 1.50]|min]|max %}
    {% set z_nudge   = [-0.3, [z_nudge,  0.30]|min]|max %}

    M221 S{(flow_adj * 100) | int}    ; set flow %
    M220 S{(speed_adj * 100) | int}   ; set speed %
    {% if z_nudge != 0.0 %}
        SET_GCODE_OFFSET Z_ADJUST={z_nudge} MOVE=1
    {% endif %}

    # Store for status queries
    SET_GCODE_VARIABLE MACRO=AMEO_INIT VARIABLE=flow_adj  VALUE={flow_adj}
    SET_GCODE_VARIABLE MACRO=AMEO_INIT VARIABLE=speed_adj VALUE={speed_adj}


# ─────────────────────────────────────────────────────────────────────────────
# SECTION E — AMEO_STATUS query macro (add after AI_REFLEXIVE_ADJUST)
# ─────────────────────────────────────────────────────────────────────────────

[gcode_macro AMEO_STATUS]
description: Print current AMEO profile state to console
gcode:
    {% set s = printer["gcode_macro AMEO_INIT"] %}
    { action_respond_info(
        "AMEO STATUS\n"
        "  nozzle   : " ~ s.nozzle_id ~ "\n"
        "  material : " ~ s.material_id ~ "\n"
        "  layer_h  : " ~ s.layer_h ~ " mm\n"
        "  flow_adj : " ~ (s.flow_adj * 100) | round(1) ~ "%\n"
        "  speed_adj: " ~ (s.speed_adj * 100) | round(1) ~ "%"
    ) }


# ─────────────────────────────────────────────────────────────────────────────
# SECTION F — Slicer start-gcode template (paste into QIDISlicer Machine G-code)
# ─────────────────────────────────────────────────────────────────────────────
# Replace the printer's existing start-gcode with this template.
# Substitute {nozzle_id} and {material_id} with your QIDISlicer filament/process
# preset variables, or hardcode per-filament preset.
#
# Example for PLA-HS + CHT 0.4mm:
#
#   AMEO_LOAD NOZZLE=cht_diamond_04 MATERIAL=anycubic_pla_hs LAYER_H=0.2
#   G28                    ; home all axes
#   Z_TILT_ADJUST          ; (if installed)
#   BED_MESH_CALIBRATE     ; (optional — use saved mesh instead for speed)
#   G1 Z5 F3000
#   G1 X10 Y10 F6000
#   M109 S{first_layer_print_temperature[0]}  ; wait for nozzle
#   M190 S{first_layer_bed_temperature[0]}    ; wait for bed
#   ; Purge line
#   G1 X10 Y5  Z0.3 F3000
#   G1 X120    E18  F1000
#   G1 X130    E1.5 F1000
#   G92 E0
#
# Example for generic QIDI 0.4mm + PLA standard:
#
#   AMEO_LOAD NOZZLE=qidi_04 MATERIAL=generic_pla_standard LAYER_H=0.2
#   [rest of start-gcode as above]


# ─────────────────────────────────────────────────────────────────────────────
# SECTION G — Input shaper verified values (Qidi Q2, 2025 chassis)
# ─────────────────────────────────────────────────────────────────────────────
# These were measured via ADXL345 resonance test.  Replace if you re-run
# SHAPER_CALIBRATE after belts or toolhead changes.

[input_shaper]
shaper_freq_x: 59.4      # Hz — measured
shaper_freq_y: 52.8      # Hz — measured
shaper_type:   mzv


# ─────────────────────────────────────────────────────────────────────────────
# SECTION H — Pressure advance per nozzle (base values from ameo_profiles.json)
# ─────────────────────────────────────────────────────────────────────────────
# These are reference starting points.  Fine-tune with PRESSURE_ADVANCE_CALIBRATE
# or the PA tower.  AMEO_LOAD overrides these at runtime per material+nozzle combo.
#
# qidi_04       + PLA-HS  → 0.040
# cht_diamond_04 + PLA-HS → 0.025
# bimetal_dlc_08 + PLA-HS → 0.010
# qidi_02       + PLA-HS  → 0.060
# qidi_08       + PLA-HS  → 0.010

[extruder]
pressure_advance: 0.040           ; default (qidi_04 + pla_standard)
pressure_advance_smooth_time: 0.04
